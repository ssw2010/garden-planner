<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BFP Floralist</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0e8;--surface:#fff;--border:#ddd8c4;--border-focus:#5a8a4a;
  --green-dark:#2c3e1a;--green-mid:#3b6d11;--green-light:#e8f0d8;
  --text:#2c2a1e;--text-muted:#7a7560;--text-italic:#1a3a08;
  --badge-ang-bg:#e8f5d0;--badge-ang:#2a5a10;
  --badge-gym-bg:#faeeda;--badge-gym:#7a4a10;
  --badge-pter-bg:#e6f1fb;--badge-pter:#0c447c;
  --badge-other-bg:#f1efe8;--badge-other:#5f5e5a;
  --edit-bg:#fffbe6;--edit-border:#c8b85a;
  --new-row:#f0fae8;
  --shadow:0 2px 12px rgba(44,62,26,.10);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── HEADER ── */
header{background:var(--green-dark);color:#f0ead8;padding:22px 32px 18px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
header h1{font-family:'Lora',serif;font-size:22px;font-weight:600;letter-spacing:.01em}
header p{font-size:12px;opacity:.6;margin-top:3px}
.header-actions{display:flex;gap:8px;flex-shrink:0}
.btn{padding:7px 16px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid;transition:all .15s;white-space:nowrap}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#f0ead8}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-primary{background:var(--green-mid);border-color:var(--green-mid);color:#fff}
.btn-primary:hover{background:#27500a}
.btn-danger{background:transparent;border-color:#e07a7a;color:#f0b0b0}
.btn-danger:hover{background:rgba(200,80,80,.15)}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px}

/* ── CONTROLS ── */
.controls{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 32px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
.tabs{display:flex;gap:5px;flex-shrink:0}
.tab{background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:6px 13px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.tab:hover{background:#ece6d5}
.tab.active{background:var(--green-dark);border-color:var(--green-dark);color:#fff}
.search-wrap{flex:1;min-width:160px;max-width:300px;position:relative}
.search-wrap input{width:100%;padding:7px 10px 7px 32px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;background:var(--bg);color:var(--text);outline:none}
.search-wrap input:focus{border-color:var(--border-focus);background:#fff}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px;pointer-events:none}
.filter-row{display:flex;gap:7px;flex-wrap:wrap}
select{padding:6px 9px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;background:var(--bg);color:var(--text);cursor:pointer;outline:none}
select:focus{border-color:var(--border-focus)}
.count{font-size:11px;color:var(--text-muted);white-space:nowrap;margin-left:auto;align-self:center}

/* ── TABLE ── */
.table-wrap{padding:16px 32px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--border);font-size:12px;box-shadow:var(--shadow)}
thead tr{background:var(--green-dark);color:#f0ead8}
th{padding:10px 12px;text-align:left;font-weight:500;font-size:10px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}
th.sortable:hover{background:#3d5525}
th .sort-icon{opacity:.4;margin-left:4px;font-size:9px}
th.sort-asc .sort-icon::after{content:'▲';opacity:1}
th.sort-desc .sort-icon::after{content:'▼';opacity:1}
th .sort-icon::after{content:'⬍'}

tbody tr{border-bottom:1px solid #eee8d8;transition:background .1s}
tbody tr:hover{background:#f5f0e0}
tbody tr:last-child{border-bottom:none}
tbody tr.new-row{background:var(--new-row)}
tbody tr.editing{background:var(--edit-bg)}
td.cell-editing{background:var(--edit-bg);outline:2px solid var(--edit-border);outline-offset:-2px;border-radius:4px;}
td{padding:8px 12px;vertical-align:middle;line-height:1.4}
td:first-child{font-style:italic;color:var(--text-italic);font-weight:500}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 8px;border-radius:11px;font-size:10px;font-weight:500;white-space:nowrap;font-style:normal}
.badge-ang{background:var(--badge-ang-bg);color:var(--badge-ang)}
.badge-gym{background:var(--badge-gym-bg);color:var(--badge-gym)}
.badge-pter{background:var(--badge-pter-bg);color:var(--badge-pter)}
.badge-other{background:var(--badge-other-bg);color:var(--badge-other)}
.type-badge{display:inline-block;padding:2px 7px;border-radius:9px;font-size:10px;background:var(--bg);color:var(--text-muted);border:1px solid var(--border);white-space:nowrap}
.shade-badge{display:inline-block;padding:2px 8px;border-radius:11px;font-size:10px;font-weight:500;white-space:nowrap}
.shade-full{background:#fff8e0;color:#8a6600}
.shade-partial{background:#e8f5d0;color:#2a5a10}
.shade-full-shade{background:#dde8f8;color:#0c447c}
.shade-none{background:var(--bg);color:var(--text-muted);border:1px solid var(--border)}

/* ── INLINE EDITING ── */
.cell-display{min-height:20px;cursor:text;border-radius:4px;padding:1px 4px;margin:-1px -4px;transition:background .12s}
.cell-display:hover{background:rgba(91,138,74,.12);outline:1.5px dashed var(--border-focus)}
.cell-display.readonly{cursor:default}
.cell-display.readonly:hover{background:transparent;outline:none}

.cell-input{display:none;width:100%;padding:3px 6px;border:1.5px solid var(--edit-border);border-radius:5px;font-family:'DM Sans',sans-serif;font-size:12px;background:#fff;color:var(--text);outline:none;font-style:inherit}
.cell-input.active{display:block}
.cell-display.hidden{display:none}

.cell-select{display:none;width:100%;padding:3px 6px;border:1.5px solid var(--edit-border);border-radius:5px;font-family:'DM Sans',sans-serif;font-size:12px;background:#fff;color:var(--text);outline:none}
.cell-select.active{display:inline-block}

/* ── ROW ACTIONS ── */
.row-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s;white-space:nowrap}
tbody tr:hover .row-actions{opacity:1}
tbody tr.editing .row-actions{opacity:1}
.action-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:10px;cursor:pointer;color:var(--text-muted);transition:all .12s}
.action-btn:hover{border-color:var(--green-mid);color:var(--green-mid);background:var(--green-light)}
.action-btn.del:hover{border-color:#c94040;color:#c94040;background:#fdeaea}

/* ── ADD ROW BAR ── */
.add-bar{padding:10px 32px 20px;display:flex;gap:8px}

/* ── EDIT HINT ── */
.edit-hint{font-size:11px;color:var(--text-muted);padding:6px 32px 0;font-style:italic}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--green-dark);color:#f0ead8;padding:9px 20px;border-radius:20px;font-size:12px;transition:transform .25s ease;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:50px 20px;color:var(--text-muted);font-size:13px}

/* ── UNDO BAR ── */
.undo-bar{position:fixed;bottom:24px;right:24px;background:#2c2a1e;color:#f5f0e8;padding:9px 16px;border-radius:10px;font-size:12px;display:none;align-items:center;gap:10px;z-index:998;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.undo-bar.show{display:flex}
.undo-btn{background:var(--green-mid);border:none;color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer}

/* ── ADMIN PIN MODAL ── */
.pin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.pin-overlay.show{display:flex}
.pin-modal{background:var(--surface);border-radius:16px;padding:32px 28px 24px;box-shadow:0 8px 40px rgba(0,0,0,.25);width:280px;text-align:center}
.pin-modal h2{font-family:'Lora',serif;font-size:18px;color:var(--green-dark);margin-bottom:6px}
.pin-modal p{font-size:12px;color:var(--text-muted);margin-bottom:20px}
.pin-dots{display:flex;justify-content:center;gap:10px;margin-bottom:20px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:background .15s,border-color .15s}
.pin-dot.filled{background:var(--green-dark);border-color:var(--green-dark)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pin-key{padding:13px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:500;cursor:pointer;background:var(--bg);color:var(--text);transition:all .12s}
.pin-key:hover{background:var(--green-light);border-color:var(--border-focus)}
.pin-key:active{background:var(--green-mid);color:#fff}
.pin-key.wide{grid-column:span 2}
.pin-error{font-size:11px;color:#c94040;min-height:16px;margin-top:4px}
.btn-cancel-pin{background:none;border:none;font-size:11px;color:var(--text-muted);cursor:pointer;margin-top:8px;text-decoration:underline}
.btn-cancel-pin:hover{color:var(--text)}

/* ── ADMIN INDICATOR ── */
.admin-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:5px 10px;border-radius:20px;font-weight:500;white-space:nowrap}
.admin-badge.locked{background:rgba(255,255,255,.12);color:rgba(240,234,216,.7);cursor:pointer;border:1px solid rgba(255,255,255,.2)}
.admin-badge.locked:hover{background:rgba(255,255,255,.2);color:#f0ead8}
.admin-badge.unlocked{background:#3b6d11;color:#fff;border:1px solid #4a8a15;cursor:pointer}
.admin-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.admin-badge.unlocked .dot{background:#7eff7e;opacity:1}

/* readonly cursor when not admin */
body.read-only .cell-display{cursor:default}
body.read-only .cell-display:hover{background:transparent;outline:none}
  .controls{padding:10px 12px}
  .table-wrap{padding:10px 8px}
  th,td{padding:6px 8px;font-size:11px}
  .tabs{flex-wrap:wrap}
  header{padding:16px 16px 14px}
  .add-bar,.edit-hint{padding-left:8px;padding-right:8px}
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>

<header>
  <div>
    <h1>BFP Floralist</h1>
    <p>Brisbane Forest Park — plant species list by genus</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost" onclick="exportCSV()">⬇ Export CSV</button>
    <button class="btn btn-primary" onclick="saveAll()">💾 Save</button>
    <button class="admin-badge locked" id="admin-badge" onclick="handleAdminClick()">
      <span class="dot"></span><span id="admin-label">Admin</span>
    </button>
  </div>
</header>

<!-- PIN Modal -->
<div class="pin-overlay" id="pin-overlay">
  <div class="pin-modal">
    <h2 id="pin-title">Admin Access</h2>
    <p id="pin-subtitle">Enter your PIN to enable editing</p>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pinKey('1')">1</button>
      <button class="pin-key" onclick="pinKey('2')">2</button>
      <button class="pin-key" onclick="pinKey('3')">3</button>
      <button class="pin-key" onclick="pinKey('4')">4</button>
      <button class="pin-key" onclick="pinKey('5')">5</button>
      <button class="pin-key" onclick="pinKey('6')">6</button>
      <button class="pin-key" onclick="pinKey('7')">7</button>
      <button class="pin-key" onclick="pinKey('8')">8</button>
      <button class="pin-key" onclick="pinKey('9')">9</button>
      <button class="pin-key" onclick="pinClear()">⌫</button>
      <button class="pin-key" onclick="pinKey('0')">0</button>
      <button class="pin-key" onclick="closePinModal()">✕</button>
    </div>
    <div class="pin-error" id="pin-error"></div>
  </div>
</div>

<div class="controls">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('natives')">Native Plants <span id="tab-count-natives"></span></button>
    <button class="tab" onclick="switchTab('weeds')">Weeds <span id="tab-count-weeds"></span></button>
    <button class="tab" onclick="switchTab('bygroup')">By Group &amp; Type</button>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Search species, family, common name…" oninput="renderTable()">
  </div>
  <div class="filter-row">
    <select id="filter-shade" onchange="renderTable()">
      <option value="">All shade</option>
      <option value="Full Sun">Full Sun</option>
      <option value="Partial Shade">Partial Shade</option>
      <option value="Full Shade">Full Shade</option>
    </select>
  </div>
  <span class="count" id="row-count"></span>
</div>

<p class="edit-hint" id="edit-hint" style="display:none">✏️ Admin mode — click any cell to edit inline.</p>

<div class="table-wrap">
  <table id="main-table">
    <thead id="table-head"></thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<div class="add-bar">
  <button class="btn btn-primary" onclick="addRow()">＋ Add Plant</button>
</div>

<div class="toast" id="toast"></div>
<div class="undo-bar" id="undo-bar">
  <span id="undo-msg">Row deleted</span>
  <button class="undo-btn" onclick="undoDelete()">Undo</button>
</div>

// ── STATE ──────────────────────────────────────────────────────────────────────
let activeTab = 'natives';
let editingCell = null;
let deletedRow = null;
let undoTimer = null;
let nextId = 1000;
let sortCol = -1;
let sortDir = 1;
let isAdmin = false;

const ADMIN_PIN = '1234'; // ← change this to your preferred PIN
let pinEntry = '';

function handleAdminClick() {
  if (isAdmin) {
    // Lock
    isAdmin = false;
    closeEdit(false);
    updateAdminUI();
    showToast('Admin mode off');
  } else {
    openPinModal();
  }
}

function openPinModal() {
  pinEntry = '';
  updatePinDots();
  document.getElementById('pin-error').textContent = '';
  document.getElementById('pin-overlay').classList.add('show');
}

function closePinModal() {
  pinEntry = '';
  updatePinDots();
  document.getElementById('pin-error').textContent = '';
  document.getElementById('pin-overlay').classList.remove('show');
}

function pinKey(digit) {
  if (pinEntry.length >= 4) return;
  pinEntry += digit;
  updatePinDots();
  if (pinEntry.length === 4) {
    setTimeout(checkPin, 120);
  }
}

function pinClear() {
  pinEntry = pinEntry.slice(0, -1);
  updatePinDots();
  document.getElementById('pin-error').textContent = '';
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('d' + i).classList.toggle('filled', i < pinEntry.length);
  }
}

function checkPin() {
  if (pinEntry === ADMIN_PIN) {
    isAdmin = true;
    closePinModal();
    updateAdminUI();
    showToast('Admin mode on — editing enabled');
  } else {
    document.getElementById('pin-error').textContent = 'Incorrect PIN, try again';
    pinEntry = '';
    updatePinDots();
    // Shake the dots
    const dots = document.querySelector('.pin-dots');
    dots.style.animation = 'none';
    dots.offsetHeight;
    dots.style.animation = 'shake .3s ease';
  }
}

function updateAdminUI() {
  const badge = document.getElementById('admin-badge');
  const label = document.getElementById('admin-label');
  const hint  = document.getElementById('edit-hint');
  if (isAdmin) {
    badge.className = 'admin-badge unlocked';
    label.textContent = 'Admin ✓';
    hint.style.display = 'block';
    document.body.classList.remove('read-only');
  } else {
    badge.className = 'admin-badge locked';
    label.textContent = 'Admin';
    hint.style.display = 'none';
    document.body.classList.add('read-only');
  }
}

// Close modal on overlay click
document.addEventListener('click', e => {
  if (e.target === document.getElementById('pin-overlay')) closePinModal();
});

// Keyboard support for PIN
document.addEventListener('keydown', e => {
  if (!document.getElementById('pin-overlay').classList.contains('show')) return;
  if (e.key >= '0' && e.key <= '9') pinKey(e.key);
  if (e.key === 'Backspace') pinClear();
  if (e.key === 'Escape') closePinModal();
});

// Load from localStorage or use defaults
function loadData() {
  try {
    const saved = localStorage.getItem('floralistData7');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  // Deep clone defaults with added _id fields
  const d = JSON.parse(JSON.stringify(RAW_DATA));
  for (const tab of Object.values(d)) {
    tab.rows = tab.rows.map((r, i) => { r._id = i; return r; });
  }
  return d;
}
let DATA = loadData();

function saveData() {
  localStorage.setItem('floralistData7', JSON.stringify(DATA));
}

// ── UTILS ──────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function groupBadgeClass(g) {
  if (g === 'ANGIOSPERMS') return 'badge-ang';
  if (g === 'GYMNOSPERMS') return 'badge-gym';
  if (g === 'PTERIDOPHYTES') return 'badge-pter';
  return 'badge-other';
}

// ── TABS & FILTERS ────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', ['natives','weeds','bygroup'][i] === tab));
  sortCol = -1;
  renderFilters();
  renderTable();
}

function renderFilters() {
  // Group and type filters removed; shade filter is static in HTML
}

function updateTabCounts() {
  for (const tab of ['natives','weeds']) {
    const el = document.getElementById('tab-count-'+tab);
    if (el) el.textContent = DATA[tab] ? `(${DATA[tab].rows.length})` : '';
  }
}

// ── RENDER TABLE ──────────────────────────────────────────────────────────────
function renderTable() {
  if (activeTab === 'bygroup') { renderByGroup(); return; }

  const dataset = DATA[activeTab];
  const headers = dataset.headers;
  const q = document.getElementById('search').value.toLowerCase();
  const fs = document.getElementById('filter-shade').value;

  // Column indices
  const COL_SHADE = headers.indexOf('SHADE TOLERANCE');

  let rows = dataset.rows.filter(r => {
    if (fs && r[COL_SHADE] !== fs) return false;
    if (q) return r.slice(0, -1).join(' ').toLowerCase().includes(q);
    return true;
  });

  if (sortCol >= 0) {
    rows = [...rows].sort((a, b) => {
      const av = (a[sortCol] || '').toString().toLowerCase();
      const bv = (b[sortCol] || '').toString().toLowerCase();
      return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });
  }

  // Head
  const thead = document.getElementById('table-head');
  thead.innerHTML = '<tr>' + headers.map((h, i) => {
    const sc = i === sortCol ? (sortDir === 1 ? ' sort-asc' : ' sort-desc') : '';
    return `<th class="sortable${sc}" onclick="sortBy(${i})">${h}<span class="sort-icon"></span></th>`;
  }).join('') + '</tr>';

  // Body
  const tbody = document.getElementById('table-body');
  if (!rows.length) { tbody.innerHTML = `<tr><td colspan="${headers.length+1}" class="empty">No species found.</td></tr>`; return; }

  tbody.innerHTML = rows.map(row => {
    const rid = row._id;
    return `<tr data-id="${rid}">` + headers.map((h, ci) => {
      const val = row[ci] || '';
      const isShade = ci === COL_SHADE;

      let display;
      if (isShade && val) {
        display = `<span class="shade-badge ${SHADE_CLASS[val]||'shade-none'}">${val}</span>`;
      } else {
        display = escHtml(val);
      }

      const editType = isShade ? 'select-shade' : 'text';
      return `<td><span class="cell-display" onclick="startEdit(this,${rid},${ci},'${editType}')">${display}</span></td>`;
    }).join('') + '</tr>';
  }).join('');

  document.getElementById('row-count').textContent = `${rows.length} of ${dataset.rows.length} species`;
  updateTabCounts();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function sortBy(ci) {
  if (sortCol === ci) sortDir = -sortDir;
  else { sortCol = ci; sortDir = 1; }
  renderTable();
}

// ── BY GROUP VIEW ─────────────────────────────────────────────────────────────
function renderByGroup() {
  const all = [...(DATA.natives?.rows||[]), ...(DATA.weeds?.rows||[])];
  const families = {};
  all.forEach(r => {
    const f = r[1] || 'UNKNOWN';
    if (!families[f]) families[f] = 0;
    families[f]++;
  });

  const sorted = Object.entries(families).sort((a,b) => a[0].localeCompare(b[0]));
  document.getElementById('table-head').innerHTML = '<tr><th>FAMILY</th><th>SPECIES COUNT</th></tr>';
  let html = sorted.map(([f, count]) =>
    `<tr><td>${escHtml(f)}</td><td>${count}</td></tr>`
  ).join('');
  document.getElementById('table-body').innerHTML = html || `<tr><td colspan="2" class="empty">No data</td></tr>`;
  document.getElementById('row-count').textContent = `${all.length} species across ${sorted.length} families`;
  updateTabCounts();
}

// ── INLINE EDITING ────────────────────────────────────────────────────────────
function startEdit(spanEl, rowId, colIdx, editType) {
  if (activeTab === 'bygroup') return;
  if (!isAdmin) return;
  // Close any open editor first
  closeEdit(true);

  const row = DATA[activeTab].rows.find(r => r._id === rowId);
  if (!row) return;

  const val = row[colIdx] || '';
  const td = spanEl.parentElement;
  spanEl.classList.add('hidden');
  td.classList.add('cell-editing');

  let input;
  if (editType === 'select-shade') {
    input = document.createElement('select');
    input.className = 'cell-select active';
    SHADE_OPTIONS.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o; opt.textContent = o || '— none —';
      if (o === val) opt.selected = true;
      input.appendChild(opt);
    });
  } else {
    input = document.createElement('input');
    input.type = 'text';
    input.className = 'cell-input active';
    input.value = val;
    if (colIdx === 0) input.style.fontStyle = 'italic';
  }

  editingCell = { spanEl, rowId, colIdx, input, tr: td.parentElement };

  input.addEventListener('blur', () => setTimeout(() => closeEdit(true), 120));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); closeEdit(true); }
    if (e.key === 'Tab') { e.preventDefault(); closeEdit(true); moveToNextCell(td, e.shiftKey); }
    if (e.key === 'Escape') closeEdit(false);
  });

  td.appendChild(input);
  input.focus();
  if (input.tagName === 'INPUT') input.select();
}

function closeEdit(save) {
  if (!editingCell) return;
  const { spanEl, rowId, colIdx, input, tr } = editingCell;
  editingCell = null;

  let newVal = input.value !== undefined ? input.value : input.textContent;

  if (save) {
    const row = DATA[activeTab].rows.find(r => r._id === rowId);
    if (row && row[colIdx] !== newVal) {
      row[colIdx] = newVal;
      saveData();
    } else {
      newVal = row ? (row[colIdx] || '') : '';
    }
  } else {
    // Revert — get original value back
    const row = DATA[activeTab].rows.find(r => r._id === rowId);
    newVal = row ? (row[colIdx] || '') : '';
  }

  // Update the cell display in-place (no full re-render)
  const headers = DATA[activeTab].headers;
  const COL_SHADE = headers.indexOf('SHADE TOLERANCE');
  let display;
  if (colIdx === COL_SHADE && newVal) {
    display = `<span class="shade-badge ${SHADE_CLASS[newVal]||'shade-none'}">${escHtml(newVal)}</span>`;
  } else {
    display = escHtml(newVal);
  }
  spanEl.innerHTML = display;

  if (input.parentElement) input.parentElement.removeChild(input);
  spanEl.classList.remove('hidden');
  spanEl.parentElement.classList.remove('cell-editing');
}

function moveToNextCell(currentTd, backwards) {
  const tds = [...currentTd.parentElement.querySelectorAll('td')];
  const idx = tds.indexOf(currentTd);
  const next = tds[backwards ? idx - 1 : idx + 1];
  if (next) {
    const span = next.querySelector('.cell-display');
    if (span) setTimeout(() => span.click(), 0);
  }
}


function addRow() {
  if (!isAdmin) { showToast('Enable admin mode to add rows'); return; }
  if (activeTab === 'bygroup') { showToast('Switch to Natives or Weeds tab to add rows'); return; }
  const headers = DATA[activeTab].headers;
  const newRow = new Array(headers.length).fill('');
  newRow._id = nextId++;
  DATA[activeTab].rows.unshift(newRow);
  saveData();
  renderTable();
  // Auto-focus first cell of new row
  const firstTr = document.querySelector('#table-body tr');
  if (firstTr) {
    firstTr.classList.add('new-row');
    const firstSpan = firstTr.querySelector('.cell-display');
    if (firstSpan) setTimeout(() => firstSpan.click(), 50);
  }
  showToast('New row added — click cells to edit');
}

function duplicateRow(rowId) {
  const idx = DATA[activeTab].rows.findIndex(r => r._id === rowId);
  if (idx < 0) return;
  const copy = [...DATA[activeTab].rows[idx]];
  copy._id = nextId++;
  copy[0] = (copy[0] || '') + ' (copy)';
  DATA[activeTab].rows.splice(idx + 1, 0, copy);
  saveData();
  renderTable();
  showToast('Row duplicated');
}

function deleteRow(rowId) {
  const idx = DATA[activeTab].rows.findIndex(r => r._id === rowId);
  if (idx < 0) return;
  deletedRow = { tab: activeTab, idx, row: DATA[activeTab].rows[idx] };
  DATA[activeTab].rows.splice(idx, 1);
  saveData();
  renderTable();
  showUndoBar();
}

function showUndoBar() {
  clearTimeout(undoTimer);
  const bar = document.getElementById('undo-bar');
  document.getElementById('undo-msg').textContent = `"${(deletedRow?.row[0]||'Row')}" deleted`;
  bar.classList.add('show');
  undoTimer = setTimeout(() => { bar.classList.remove('show'); deletedRow = null; }, 5000);
}

function undoDelete() {
  if (!deletedRow) return;
  DATA[deletedRow.tab].rows.splice(deletedRow.idx, 0, deletedRow.row);
  deletedRow = null;
  clearTimeout(undoTimer);
  document.getElementById('undo-bar').classList.remove('show');
  saveData();
  renderTable();
  showToast('Row restored');
}

// ── SAVE / EXPORT ─────────────────────────────────────────────────────────────
function saveAll() {
  closeEdit(true);
  saveData();
  showToast('All changes saved ✓');
}

function exportCSV() {
  if (activeTab === 'bygroup') { showToast('Switch to a tab with data to export'); return; }
  const dataset = DATA[activeTab];
  const lines = [dataset.headers.join(',')];
  dataset.rows.forEach(r => {
    lines.push(r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `floralist-${activeTab}.csv`;
  a.click();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
// Ensure _id on all rows
for (const tab of Object.values(DATA)) {
  if (tab.rows) tab.rows.forEach((r, i) => { if (r._id === undefined) r._id = nextId++; });
}

renderFilters();
renderTable();
updateTabCounts();
updateAdminUI();
