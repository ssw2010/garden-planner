<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BFP Floralist</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f5f0e8;color:#2c2a1e;min-height:100vh}
header{background:#2c3e1a;color:#f0ead8;padding:24px 32px 20px}
header h1{font-family:'Lora',serif;font-size:24px;font-weight:600;margin-bottom:4px}
header p{font-size:13px;opacity:.7}
.controls{background:#fff;border-bottom:1px solid #ddd8c4;padding:14px 32px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tabs{display:flex;gap:6px;flex-shrink:0}
.tab{background:#f5f0e8;border:1.5px solid #ddd8c4;border-radius:8px;padding:7px 14px;font-family:'DM Sans',sans-serif;font-size:13px;color:#5a5540;cursor:pointer;transition:all .15s;white-space:nowrap}
.tab:hover{background:#ece6d5}
.tab.active{background:#2c3e1a;border-color:#2c3e1a;color:#fff}
.search-wrap{flex:1;min-width:180px;max-width:340px;position:relative}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1.5px solid #ddd8c4;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;background:#f5f0e8;color:#2c2a1e;outline:none}
.search-wrap input:focus{border-color:#5a8a4a;background:#fff}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9a9070;font-size:14px;pointer-events:none}
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
select{padding:7px 10px;border:1.5px solid #ddd8c4;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;background:#f5f0e8;color:#2c2a1e;cursor:pointer;outline:none}
select:focus{border-color:#5a8a4a}
.count{font-size:12px;color:#7a7560;white-space:nowrap;align-self:center;margin-left:auto}
.table-wrap{padding:20px 32px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #ddd8c4;font-size:13px}
thead tr{background:#2c3e1a;color:#f0ead8}
th{padding:11px 14px;text-align:left;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
tbody tr{border-bottom:1px solid #eee8d8;transition:background .1s}
tbody tr:hover{background:#f5f0e0}
tbody tr:last-child{border-bottom:none}
td{padding:9px 14px;vertical-align:middle;line-height:1.4}
td:first-child{font-style:italic;color:#1a3a08;font-weight:500}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:500;white-space:nowrap;font-style:normal}
.badge-ang{background:#e8f5d0;color:#2a5a10}
.badge-gym{background:#faeeda;color:#7a4a10}
.badge-pter{background:#e6f1fb;color:#0c447c}
.badge-other{background:#f1efe8;color:#5f5e5a}
.type-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#f5f0e8;color:#5a5540;border:1px solid #ddd8c4;white-space:nowrap}
.status-cell{font-size:12px;color:#7a7560;max-width:220px}
.empty{text-align:center;padding:60px 20px;color:#9a9070;font-size:14px}
@media(max-width:640px){.controls{padding:12px 14px}.table-wrap{padding:12px 8px}th,td{padding:7px 9px;font-size:12px}.tabs{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <h1>BFP Floralist</h1>
  <p>Brisbane Forest Park — plant species list by genus</p>
</header>
<div class="controls">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('natives')">Native Plants <span id="tab-count-natives"></span></button>
    <button class="tab" onclick="switchTab('weeds')">Weeds <span id="tab-count-weeds"></span></button>
    <button class="tab" onclick="switchTab('bygroup')">By Group &amp; Type</button>
  </div>
  <div class="search-wrap">
    <span class="search-icon">&#9906;</span>
    <input type="text" id="search" placeholder="Search species, family, common name…" oninput="renderTable()">
  </div>
  <div class="filter-row">
    <select id="filter-group" onchange="renderTable()"><option value="">All groups</option></select>
    <select id="filter-type" onchange="renderTable()"><option value="">All types</option></select>
  </div>
  <span class="count" id="row-count"></span>
</div>
<div class="table-wrap">
  <table id="main-table">
    <thead id="table-head"></thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

const TYPE_LABELS = {D:'Dicot',M:'Monocot',G:'Gymnosperm',F:'Fern & fern ally','':'-'};

function groupBadge(g){
  if(!g)return'-';
  const cls=g.includes('ANGIO')?'badge-ang':g.includes('GYMNO')?'badge-gym':g.includes('PTERI')?'badge-pter':'badge-other';
  return `<span class="badge ${cls}">${g}</span>`;
}

let activeTab='natives';

function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',['natives','weeds','bygroup'][i]===tab);
  });
  document.getElementById('search').value='';
  document.getElementById('filter-group').value='';
  document.getElementById('filter-type').value='';
  populateFilters();
  renderTable();
}

function populateFilters(){
  const sheet=DATA[activeTab];
  const hi=sheet.headers.map(h=>h.toLowerCase());
  const gi=hi.findIndex(h=>h==='group'), ti=hi.findIndex(h=>h==='type');
  const gSel=document.getElementById('filter-group');
  const tSel=document.getElementById('filter-type');
  gSel.innerHTML='<option value="">All groups</option>';
  tSel.innerHTML='<option value="">All types</option>';
  if(gi>=0){
    const groups=[...new Set(sheet.rows.map(r=>r[gi]).filter(Boolean))].sort();
    groups.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;gSel.appendChild(o);});
    gSel.style.display='';
  } else gSel.style.display='none';
  if(ti>=0){
    const types=[...new Set(sheet.rows.map(r=>r[ti]).filter(Boolean))].sort();
    types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=TYPE_LABELS[t]||t;tSel.appendChild(o);});
    tSel.style.display='';
  } else tSel.style.display='none';
}

function renderTable(){
  const sheet=DATA[activeTab];
  const q=document.getElementById('search').value.toLowerCase();
  const gFilter=document.getElementById('filter-group').value;
  const tFilter=document.getElementById('filter-type').value;
  const hi=sheet.headers.map(h=>h.toLowerCase());
  const gi=hi.findIndex(h=>h==='group'), ti=hi.findIndex(h=>h==='type');
  const colCount=sheet.headers.filter(h=>h).length;

  let rows=sheet.rows.filter(r=>{
    if(q&&!r.join(' ').toLowerCase().includes(q))return false;
    if(gFilter&&gi>=0&&r[gi]!==gFilter)return false;
    if(tFilter&&ti>=0&&r[ti]!==tFilter)return false;
    return true;
  });

  const thead=document.getElementById('table-head');
  const visHeaders=sheet.headers.filter(h=>h);
  thead.innerHTML='<tr>'+visHeaders.map(h=>`<th>${h}</th>`).join('')+'</tr>';

  const tbody=document.getElementById('table-body');
  if(rows.length===0){
    tbody.innerHTML=`<tr><td colspan="${colCount}" class="empty">No matching plants found.</td></tr>`;
    document.getElementById('row-count').textContent='0 results';
    return;
  }

  tbody.innerHTML=rows.map(r=>{
    const cells=r.slice(0,colCount);
    return '<tr>'+cells.map((v,i)=>{
      const h=(sheet.headers[i]||'').toLowerCase();
      if(h==='group')return`<td>${groupBadge(v)}</td>`;
      if(h==='type')return`<td><span class="type-badge">${TYPE_LABELS[v]||v||'-'}</span></td>`;
      if(h==='status')return`<td class="status-cell">${v||'-'}</td>`;
      return`<td>${v||'-'}</td>`;
    }).join('')+'</tr>';
  }).join('');

  const shown=rows.length.toLocaleString();
  const total=sheet.rows.length.toLocaleString();
  document.getElementById('row-count').textContent=rows.length<sheet.rows.length?`${shown} of ${total} plants`:`${shown} plants`;
}

['natives','weeds'].forEach(k=>{
  const el=document.getElementById('tab-count-'+k);
  if(el)el.textContent='('+DATA[k].rows.length+')';
});

populateFilters();
renderTable();
</script>
