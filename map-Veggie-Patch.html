<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Veggie Patch — Garden Map</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f4ec;min-height:100vh;padding:40px 32px}
  h1{font-size:1.7rem;color:#2d5016;margin-bottom:6px}
  .sub{color:#6b7a5e;font-size:.92rem;margin-bottom:28px}
  .card{background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.09);padding:32px;display:inline-block}
  svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .legend{margin-top:20px;font-size:.85rem;color:#444;display:flex;flex-wrap:wrap;align-items:center}
  .leg-title{font-weight:600;margin-right:12px;color:#333;flex-shrink:0}
  .key{margin-top:14px;font-size:.78rem;color:#999;display:flex;gap:20px;flex-wrap:wrap}
  .key span{display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<h1>🌿 Veggie Patch</h1>
<p class="sub">3m &times; 4m &nbsp;&middot;&nbsp; 6 plants &nbsp;&middot;&nbsp; circle diameter = spacing</p>
<div class="card">

      <g><title>Basil | spacing: 0.3m | sun: full | water: medium</title>
  <circle cx="18" cy="18" r="18" fill="#e74c3c" fill-opacity="0.85" stroke="white" stroke-width="2"/>

</g><g><title>Carrot | spacing: 0.15m | sun: full | water: medium</title>
  <circle cx="45" cy="9" r="9" fill="#e67e22" fill-opacity="0.85" stroke="white" stroke-width="2"/>

</g><g><title>Tomato | spacing: 0.5m | sun: full | water: high</title>
  <circle cx="84" cy="30" r="30" fill="#f39c12" fill-opacity="0.85" stroke="white" stroke-width="2"/>
  <text x="84" y="29" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="white" font-weight="600">Tomato</text>
  <text x="84" y="44" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="rgba(255,255,255,.85)">0.5m</text>
</g><g><title>Fennel | spacing: 0.4m | sun: full | water: medium</title>
  <circle cx="138" cy="24" r="24" fill="#27ae60" fill-opacity="0.85" stroke="white" stroke-width="2"/>

  </svg>

  <div class="key">
    <span><svg width="28" height="6"><line x1="0" y1="3" x2="28" y2="3" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3"/></svg>Good companions</span>
    <span><svg width="28" height="6"><line x1="0" y1="3" x2="28" y2="3" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3"/></svg>Conflict</span>
  </div>
</div>

</html>
